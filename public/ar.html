<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8">
    <title>OCB AR Experience</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <!-- A-Frame Extras for animation -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }
      #ui-overlay {
        position: absolute;
        bottom: 30px;
        left: 0;
        width: 100%;
        text-align: center;
        z-index: 100;
        pointer-events: none;
      }
      .instruction {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 12px 24px;
        border-radius: 30px;
        display: inline-block;
        font-size: 15px;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
    </style>
  </head>
  <body>
    <div id="ui-overlay">
      <div class="instruction">Hãy hướng camera vào mặt trước của thẻ OCB</div>
    </div>
    
    <!-- 
      LƯU Ý CHO DEV:
      1. Hiện tại đang dùng imageTargetSrc mặc định của thư viện MindAR để làm mẫu (cần trỏ camera vào hình ảnh thẻ test của MindAR).
      2. Để chạy thật, bạn cần dùng công cụ MindAR Compiler (https://hiukim.github.io/mind-ar-js-doc/tools/compile) 
         để tạo file .mind từ hình ảnh mặt trước của thẻ OCB, sau đó thay link vào imageTargetSrc.
      3. src="#avatarModel" hiện tại là model chú gấu trúc (raccoon) miễn phí để thay thế tạm cho chú mèo. 
         Bạn có thể tải model GLTF chú mèo lên host và đổi link.
    -->
    <a-scene mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/card-example/card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.2/examples/image-tracking/assets/band-example/raccoon/scene.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- 3D Model -->
        <a-gltf-model rotation="90 0 0" position="0 -0.2 0" scale="0.05 0.05 0.05" src="#avatarModel" animation-mixer="clip: *">
        </a-gltf-model>
        
        <!-- Text Panels for Card Details -->
        <a-entity position="0 0.4 0.1">
          <a-plane color="#00B050" width="1.2" height="0.5" opacity="0.9" border-radius="0.1"></a-plane>
          <a-text 
            value="THE TIN DUNG OCB\n\n- Hoan tien den 15%\n- Mien phi thuong nien\n- Han muc 50 trieu VND" 
            position="0 0 0.02" 
            align="center" 
            color="#FFFFFF" 
            scale="0.25 0.25 0.25" 
            wrap-count="25"
            line-height="60">
          </a-text>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
