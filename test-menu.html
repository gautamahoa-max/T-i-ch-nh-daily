<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
  .menu {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: #E5B80B;
    clip-path: circle(150vh at 100% 0%);
    transition: clip-path 0.7s cubic-bezier(0.85, 0, 0.15, 1);
  }
  .closed { clip-path: circle(0px at 100% 0%); }
  .anchor {
    position: absolute;
    top: 2rem;
    right: 2rem;
  }
  .item {
    position: absolute;
    right: 0;
    top: 0;
    transform-origin: right center;
    font-size: 3rem;
    font-weight: 900;
    white-space: nowrap;
    text-decoration: none;
    color: #1a1a1a;
  }
</style>
</head>
<body>
<div class="menu closed" id="menu">
  <div class="anchor">
    <a href="#" class="item" style="transform: rotate(25deg) translateX(-100px);">HỆ SINH THÁI</a>
    <a href="#" class="item" style="transform: rotate(60deg) translateX(-150px);">HƯỚNG DẪN MỞ</a>
  </div>
</div>
<button style="position:fixed; top:1rem; right:1rem; z-index:100;" onclick="document.getElementById('menu').classList.toggle('closed')">Toggle</button>
</body>
</html>
