<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; }
  .menu {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: #FFC107;
    clip-path: circle(150vh at calc(100% - 38px) 40px);
  }
  .item {
    position: absolute;
    font-size: 36px;
    font-weight: 900;
    white-space: nowrap;
    text-decoration: none;
    color: #1a1a1a;
    transform-origin: right center;
  }
</style>
</head>
<body>
<div class="menu" id="menu">
    <a href="#" class="item" style="top: 120px; right: 40px; transform: rotate(-10deg);">HỆ SINH THÁI</a>
    <a href="#" class="item" style="top: 200px; right: 80px; transform: rotate(-25deg);">HƯỚNG DẪN MỞ</a>
    <a href="#" class="item" style="top: 280px; right: 140px; transform: rotate(-40deg);">LIÊN HỆ</a>
</div>
</body>
</html>
